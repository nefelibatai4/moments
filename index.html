<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 用 %BASE_URL% 而不是写死的 /moments/：构建时 Vite 会替换成对应 base，
         这样网页端（base=/moments/）和 Capacitor iOS 包（base=/）都能正确解析 -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#0f1016" />

    <!-- iOS 专属：添加到主屏幕 -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Moments" />
    <meta name="application-name" content="Moments" />

    <title>moments</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
